<?xml version="1.0" encoding="UTF-8"?>
<!-- Обобщена илюстрация на принтер тип "bedslinger" (Ender-стил). Собствена рисунка за ANG_Ender_screen. -->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A5F66"/>
      <stop offset="0.5" stop-color="#8A9099"/>
      <stop offset="1" stop-color="#4A4F56"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C838C"/>
      <stop offset="1" stop-color="#4E545B"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2F35"/>
      <stop offset="1" stop-color="#16181B"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3E44"/>
      <stop offset="1" stop-color="#1E2024"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DA5FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3DA5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- меко синьо сияние зад принтера -->
  <ellipse cx="150" cy="165" rx="140" ry="125" fill="url(#glow)"/>

  <!-- основа -->
  <path d="M40 228 L260 228 L272 262 L28 262 Z" fill="url(#base)"/>
  <rect x="28" y="262" width="244" height="8" rx="2" fill="#111316"/>
  <!-- малък дисплей отпред -->
  <rect x="198" y="236" width="44" height="20" rx="3" fill="#0E1114" stroke="#3DA5FF" stroke-width="1.2"/>
  <rect x="202" y="240" width="22" height="3" rx="1.5" fill="#3DA5FF" opacity="0.8"/>

  <!-- вертикални профили -->
  <rect x="58" y="38" width="16" height="192" rx="2" fill="url(#frame)"/>
  <rect x="226" y="38" width="16" height="192" rx="2" fill="url(#frame)"/>
  <!-- горна греда -->
  <rect x="52" y="28" width="196" height="16" rx="3" fill="url(#top)"/>

  <!-- X греда с глава -->
  <rect x="70" y="112" width="160" height="10" rx="2" fill="#6B727B"/>
  <rect x="134" y="98" width="34" height="40" rx="4" fill="#2A2E33" stroke="#555B63" stroke-width="1"/>
  <rect x="140" y="104" width="22" height="12" rx="2" fill="#3DA5FF" opacity="0.85"/>
  <path d="M146 138 L156 138 L153 148 L149 148 Z" fill="#C9CED4"/>
  <!-- вентилатор на главата -->
  <circle cx="151" cy="125" r="6" fill="none" stroke="#7D848D" stroke-width="1.5"/>

  <!-- легло -->
  <path d="M60 196 L240 196 L252 214 L48 214 Z" fill="url(#bed)" stroke="#3B4047" stroke-width="1"/>
  <path d="M60 196 L240 196" stroke="#5C636B" stroke-width="1.5"/>

  <!-- модел върху леглото -->
  <path d="M132 196 L132 176 L146 170 L168 170 L168 196 Z" fill="#DADDE1"/>
  <rect x="150" y="160" width="8" height="10" fill="#DADDE1"/>

  <!-- макара филамент отстрани -->
  <circle cx="150" cy="24" r="0" fill="none"/>
  <rect x="242" y="70" width="22" height="6" rx="2" fill="#4A4F56"/>
  <circle cx="268" cy="96" r="22" fill="#23272C" stroke="#4A4F56" stroke-width="3"/>
  <circle cx="268" cy="96" r="13" fill="#3DA5FF" opacity="0.75"/>
  <circle cx="268" cy="96" r="5" fill="#1A1D21"/>
</svg>
