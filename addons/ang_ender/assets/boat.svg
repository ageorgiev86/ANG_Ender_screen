<?xml version="1.0" encoding="UTF-8"?>
<!-- Малък влекач, отпечатан в бял PLA. Собствена рисунка за ANG_Ender_screen (вдъхновена от тестовите корабчета). -->
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="170" viewBox="0 0 220 170">
  <defs>
    <linearGradient id="hullSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F5F7"/>
      <stop offset="1" stop-color="#B9BDC4"/>
    </linearGradient>
    <linearGradient id="hullFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9DCE1"/>
      <stop offset="1" stop-color="#A7ACB4"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DADDE2"/>
    </linearGradient>
    <linearGradient id="cabinSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFBFC"/>
      <stop offset="1" stop-color="#C9CDD3"/>
    </linearGradient>
    <linearGradient id="cabinFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4C8CF"/>
      <stop offset="1" stop-color="#9DA2AA"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="layers" width="4" height="2.6" patternUnits="userSpaceOnUse">
      <rect width="4" height="2.6" fill="none"/>
      <line x1="0" y1="2.4" x2="4" y2="2.4" stroke="#000" stroke-opacity="0.06" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- сянка -->
  <ellipse cx="112" cy="150" rx="92" ry="12" fill="url(#shadow)"/>

  <!-- корпус: страна -->
  <path d="M22 96 L168 96 L200 88 L186 128 Q182 140 168 142 L48 142 Q34 140 30 128 Z" fill="url(#hullSide)"/>
  <path d="M22 96 L168 96 L200 88 L186 128 Q182 140 168 142 L48 142 Q34 140 30 128 Z" fill="url(#layers)"/>
  <!-- нос (тъмна страна) -->
  <path d="M168 96 L200 88 L186 128 Q182 140 168 142 Z" fill="url(#hullFront)"/>
  <!-- палуба -->
  <path d="M22 96 L44 84 L176 80 L200 88 L168 96 Z" fill="url(#deck)"/>
  <!-- борд -->
  <path d="M22 96 L168 96 L200 88" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <!-- кнехт и котва-отвор -->
  <circle cx="182" cy="104" r="4" fill="#8E939B"/>
  <rect x="58" y="88" width="8" height="5" rx="1.5" fill="#B4B8BF"/>

  <!-- кабина: страна -->
  <path d="M62 50 L128 50 L128 92 L62 94 Z" fill="url(#cabinSide)"/>
  <path d="M62 50 L128 50 L128 92 L62 94 Z" fill="url(#layers)"/>
  <!-- кабина: предна стена -->
  <path d="M128 50 L150 44 L150 86 L128 92 Z" fill="url(#cabinFront)"/>
  <!-- покрив -->
  <path d="M56 50 L80 40 L156 36 L150 44 L128 50 Z" fill="#FFFFFF"/>
  <path d="M56 50 L128 50 L150 44" fill="none" stroke="#C3C7CD" stroke-width="1.2"/>
  <!-- врата (арка) -->
  <path d="M80 94 L80 70 Q88 60 96 70 L96 93 Z" fill="#7E838B"/>
  <!-- прозорци -->
  <rect x="104" y="60" width="16" height="13" rx="2.5" fill="#7E838B"/>
  <path d="M133 58 L145 55 L145 68 L133 71 Z" fill="#6F747C"/>
  <!-- комин -->
  <path d="M94 22 L108 22 L108 40 L94 41 Z" fill="url(#cabinSide)"/>
  <path d="M108 22 L114 20 L114 38 L108 40 Z" fill="url(#cabinFront)"/>
  <ellipse cx="104" cy="21.5" rx="10" ry="3" fill="#E8EAED"/>
  <ellipse cx="104" cy="21.5" rx="6.5" ry="1.8" fill="#7E838B"/>
  <!-- светлинен ръб по кабината -->
  <path d="M62 50 L62 94" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
</svg>
